services:
  api:
    image: ${CNODE_API_IMAGE:-ghcr.io/cnodejs/cnode-api:latest}
    env_file: .env
    environment:
      DB_DIALECT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cnode}
      DB_USER: ${POSTGRES_USER:-cnode}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3001}:3001"
    networks:
      - cnode-internal
      - legacy-cnode
    restart: unless-stopped

  web:
    image: ${CNODE_WEB_IMAGE:-ghcr.io/cnodejs/cnode-web:latest}
    env_file: .env
    environment:
      APP_API_INTERNAL_BASE_URL: http://api:3001
      APP_API_BASE_URL: ${APP_API_BASE_URL:-https://api.cnodejs.org}
    depends_on:
      - api
    networks:
      - cnode-internal
      - legacy-cnode
    restart: unless-stopped

  worker:
    image: ${CNODE_API_IMAGE:-ghcr.io/cnodejs/cnode-api:latest}
    env_file: .env
    environment:
      DB_DIALECT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cnode}
      DB_USER: ${POSTGRES_USER:-cnode}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["pnpm", "--filter", "@cnode/api", "worker:moderation"]
    networks:
      - cnode-internal
    restart: unless-stopped

  migrate-schema:
    image: ${CNODE_API_IMAGE:-ghcr.io/cnodejs/cnode-api:latest}
    env_file: .env
    environment:
      DB_DIALECT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cnode}
      DB_USER: ${POSTGRES_USER:-cnode}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "db:push:pg"]
    profiles:
      - migrate
    networks:
      - cnode-internal
      - legacy-cnode

  migrate-data:
    image: ${CNODE_API_IMAGE:-ghcr.io/cnodejs/cnode-api:latest}
    env_file: .env
    environment:
      DB_DIALECT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cnode}
      DB_USER: ${POSTGRES_USER:-cnode}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MIGRATION_TARGET: rehearsal
      MIGRATION_REPORT_PATH: /app/migration-reports/migration-report.json
    volumes:
      - ./migration-reports:/app/migration-reports
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "migrate:mongo-to-pg"]
    profiles:
      - migrate
    networks:
      - cnode-internal
      - legacy-cnode

  reconcile:
    image: ${CNODE_API_IMAGE:-ghcr.io/cnodejs/cnode-api:latest}
    env_file: .env
    environment:
      DB_DIALECT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cnode}
      DB_USER: ${POSTGRES_USER:-cnode}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MIGRATION_REPORT_PATH: /app/migration-reports/migration-report.json
    volumes:
      - ./migration-reports:/app/migration-reports
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "migrate:reconcile"]
    profiles:
      - migrate
    networks:
      - cnode-internal
      - legacy-cnode

  postgres:
    image: postgres:18-bookworm
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cnode}
      POSTGRES_USER: ${POSTGRES_USER:-cnode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnode-internal
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnode-internal
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  cnode-internal:
    driver: bridge
  legacy-cnode:
    name: ${LEGACY_DOCKER_NETWORK:-cnode}
    external: true
