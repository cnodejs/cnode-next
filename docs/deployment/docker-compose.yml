# Repository baseline for production Compose configuration.
# Keep environment-specific services, secrets, and paths outside this file.
services:
  api:
    image: ${CNODE_API_IMAGE:?CNODE_API_IMAGE is required}
    env_file: ${CNODE_ENV_FILE:-.env}
    environment:
      CNODE_OTEL_LOGS_ENABLED: ${CNODE_OTEL_LOGS_ENABLED:-1}
      CNODE_OTEL_METRICS_ENABLED: ${CNODE_OTEL_METRICS_ENABLED:-1}
      CNODE_OTEL_TRACES_ENABLED: ${CNODE_OTEL_TRACES_ENABLED:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3001/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "3001:3001"
    networks:
      - cnode-internal
    restart: unless-stopped

  web:
    image: ${CNODE_WEB_IMAGE:?CNODE_WEB_IMAGE is required}
    env_file: ${CNODE_ENV_FILE:-.env}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cnode-internal
    restart: unless-stopped

  worker:
    image: ${CNODE_API_IMAGE:?CNODE_API_IMAGE is required}
    env_file: ${CNODE_ENV_FILE:-.env}
    environment:
      CNODE_OTEL_LOGS_ENABLED: ${CNODE_OTEL_LOGS_ENABLED:-1}
      CNODE_OTEL_METRICS_ENABLED: ${CNODE_OTEL_METRICS_ENABLED:-1}
      CNODE_OTEL_TRACES_ENABLED: ${CNODE_OTEL_TRACES_ENABLED:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: ["pnpm", "--filter", "@cnode/api", "worker:moderation"]
    networks:
      - cnode-internal
    restart: unless-stopped

  adminer:
    image: adminer:5.4.2
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    profiles:
      - adminer
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cnode-internal

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    env_file: ${CNODE_ENV_FILE:-.env}
    environment:
      ZO_COMPACT_DATA_RETENTION_DAYS: "${ZO_COMPACT_DATA_RETENTION_DAYS:-30}"
    volumes:
      - openobserve-data:/data
    healthcheck:
      test: ["CMD", "/openobserve", "node", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cnode-internal
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    env_file: ${CNODE_ENV_FILE:-.env}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      openobserve:
        condition: service_healthy
    networks:
      - cnode-internal
    restart: unless-stopped

  postgres:
    image: postgres:18-bookworm
    env_file: ${CNODE_ENV_FILE:-.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnode-internal
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    env_file: ${CNODE_ENV_FILE:-.env}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnode-internal
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  openobserve-data:
    name: openobserve-data

networks:
  cnode-internal:
    driver: bridge
